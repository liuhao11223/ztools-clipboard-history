<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>剪切板</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <div class="brand">剪切板</div>
      <div id="theme-switch" class="theme-switch" role="group" aria-label="主题">
        <button type="button" class="theme-btn" data-theme="light" title="浅色主题" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.6v2.2M12 19.2v2.2M4.5 4.5l1.6 1.6M17.9 17.9l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.5 19.5l1.6-1.6M17.9 6.1l1.6-1.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="theme-btn" data-theme="dark" title="深色主题" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 14.4A8.2 8.2 0 0 1 9.6 4a8.4 8.4 0 1 0 10.4 10.4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="theme-btn" data-theme="system" title="跟随系统主题" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 20h7M12 16.5V20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <main id="panels">
      <section id="left">
        <div class="panel-head"><span>历史</span><span id="history-count" class="muted"></span></div>
        <div id="history-list" class="list"></div>
      </section>
      <div id="splitter" title="拖拽调整宽度"></div>
      <aside id="right">
        <div class="panel-head"><span>常用</span></div>
        <div id="group-chips" class="chips"></div>
        <div id="snippet-list" class="list"></div>
        <button id="btn-add-snippet" class="add-btn">＋ 添加常用文字</button>
      </aside>
    </main>

    <footer id="preview"><div id="preview-content">悬浮任意记录显示预览</div></footer>

    <div id="snippet-editor" class="hidden">
      <div class="editor-panel">
        <div class="editor-head">
          <span id="editor-title">添加常用文字</span>
          <button id="editor-close" class="icon-btn" title="关闭">✕</button>
        </div>
        <div class="editor-body">
          <label class="row"><span>分组</span><select id="editor-group"></select></label>
          <label class="row"><span>标签</span><input id="editor-tag" type="text" placeholder="如：邮箱 / 地址" spellcheck="false" /></label>
          <label class="col"><span>内容</span><textarea id="editor-text" placeholder="输入常用文字内容..."></textarea></label>
          <div class="row actions"><button id="editor-cancel" class="btn">取消</button><button id="editor-save" class="btn primary">保存</button></div>
        </div>
      </div>
    </div>

    <div id="toast"></div>
  </div>
  <script src="lib/core.js"></script>
  <script src="app.js"></script>
</body>
</html>
